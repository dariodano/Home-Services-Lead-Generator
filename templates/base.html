<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Lead CRM{% endblock %}</title>
<style>
  :root {
    --fg: #1a1d23; --muted: #6b7280; --line: #e5e7eb;
    --bg: #f6f7f9; --card: #ffffff; --accent: #2563eb;
    --ok-bg: #ecfdf5; --ok-fg: #065f46;
    --err-bg: #fef2f2; --err-fg: #991b1b;
    --info-bg: #eff6ff; --info-fg: #1e40af;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line);
           padding: 12px 24px; }
  header a { font-weight: 700; font-size: 17px; color: var(--fg);
             text-decoration: none; }
  main { max-width: 920px; margin: 28px auto 80px; padding: 0 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  .banner { padding: 10px 14px; border-radius: 8px; margin: 0 0 18px;
            font-size: 14px; }
  .banner.info { background: var(--info-bg); color: var(--info-fg); }
  .banner.ok   { background: var(--ok-bg);   color: var(--ok-fg); }
  .banner.err  { background: var(--err-bg);  color: var(--err-fg); }

  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; padding: 18px; margin-bottom: 24px; }

  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th { text-align: left; font-size: 12px; text-transform: uppercase;
       letter-spacing: .04em; color: var(--muted); padding: 10px 14px;
       border-bottom: 1px solid var(--line); background: #fafafa; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--line);
       vertical-align: top; }
  tr:last-child td { border-bottom: none; }

  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600;
           padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.no-site { background: #fee2e2; color: #991b1b; }
  .badge.social  { background: #fef3c7; color: #92400e; }

  button, .btn { font: inherit; }
  button.primary { background: var(--accent); color: #fff; border: none;
                   border-radius: 8px; padding: 8px 18px; font-weight: 600;
                   cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.danger { background: none; border: none; color: var(--muted);
                  cursor: pointer; font-size: 14px; padding: 2px 6px; }
  button.danger:hover { color: #dc2626; }

  input[type=text], input[type=number] {
    font: inherit; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; }
  label { font-size: 14px; }

  tr.done td { opacity: .4; }
  tr.done td.lead-name { text-decoration: line-through; }
  .checkcell { width: 34px; }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent);
                         cursor: pointer; }
</style>
</head>
<body>
<header><a href="{{ url_for('index') }}">📞 Lead CRM</a></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
